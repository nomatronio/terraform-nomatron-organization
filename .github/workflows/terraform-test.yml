name: Terraform tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize module
        run: terraform init -backend=false

      - name: Validate module
        run: terraform validate

      - name: Validate examples
        run: |
          for dir in examples/basic examples/complete; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: Run module tests
        run: terraform test
      - name: Run basic example tests
        run: terraform -chdir=examples/basic test
